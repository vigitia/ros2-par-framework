# Co-authored by Claude Code.
# All available parameters of all available nodes with their default values.
# Individual profiles will override what they need differently from here.

# Namespaces for the nodes are set in the launch file itself.

# Do not edit this file, create a new profile first

# Camera: Logitech Brio
/camera/brio/logitech_brio_node:
  ros__parameters:
    # Compatibility with third-party subscribers:
    #   best_effort  lowest latency, only best-effort subscribers connect
    #   reliable     every subscriber connects, a slow one can hold up delivery. Needed for e.g. ROS 2 cameracalibrator
    qos_reliability: best_effort
    # Channel order of colour frames: bgr8, or rgb8 for nodes that expect RGB.
    encoding: bgr8
    # Index of the /dev/video* node. Find it with: v4l2-ctl --list-devices. -1 will trigger a camera auto detect
    camera_id: -1
    camera_resolution_x: 1920
    camera_resolution_y: 1080
    camera_fps: 60
    # Exposure per frame in ms (node default 10.0) and gain (0-255, node default 0). A short exposure keeps fast
    # moving pages sharp enough for the marker detection; the gain makes up for the lost brightness at the cost of
    # noise. Below 10 ms, mains-powered lamps (and later the projector) may make the image pulse or show bands:
    # check the image after changing it. Write the exposure with a decimal point, e.g. 4.0.
    exposure_time_ms: 4.0
    gain: 64
    # The calibration is calibration/intrinsics/[<profile>/]camera_info_brio.yaml below this file: the launch
    # files set camera_info_url, cameracalibrator's COMMIT button writes it there. Missing file = uncalibrated
    # CameraInfo.
    # Publish image_rect_color, needs that calibration.
    undistort_frame: false

# Camera: Generic webcam (camera: webcam), any UVC camera through v4l2_camera, started as
# /cameras/<camera>/webcam_node by launch/camera_webcam.launch.py. The type's defaults are under /cameras/*/...
# (every camera of the type); a profile overrides one camera under /cameras/<camera>/... Within one file the later
# section wins, so a /cameras/*/ section must come before any exact section of the same node.
# The camera's own controls (exposure, focus, ...) depend on the actual camera. Find available parameters with:
# ros2 param list /cameras/webcam/webcam_node
/cameras/*/webcam_node:
  ros__parameters:
    # Find it with: v4l2-ctl --list-devices. A /dev/v4l/by-id path stays the same across replugs.
    video_device: /dev/video0
    # Must be a size the camera offers in pixel_format: v4l2-ctl -d <device> --list-formats-ext
    image_size: [640, 480]
    pixel_format: YUYV
    # Like the Brio's encoding. The optical frame (<camera>_optical_frame) and the calibration
    # (calibration/intrinsics/[<profile>/]camera_info_webcam.yaml below this file) are set by the launch files.
    output_encoding: bgr8

# Camera: Intel RealSense, e.g. the D435, through realsense2_camera; launch/camera_realsense.launch.py starts it as
# /cameras/<camera>/realsense. It publishes its factory calibration, so it needs no camera_info_<camera>.yaml.
# More options: ros2 param list /cameras/realsense/realsense
/cameras/*/realsense:
  ros__parameters:
    # The streams explicitly: newer drivers start only the streams the device marks as default, and the node
    # without rs_launch.py also streams the two infrared images, which nothing in the framework uses.
    enable_color: true
    enable_depth: true
    enable_infra1: false
    enable_infra2: false
    rgb_camera:
      # <width>x<height>x<fps>, one the camera offers (rs-enumerate-devices). The aligned depth image has the
      # same size.
      color_profile: 1280x720x30
      # Like the Brio's encoding; the driver's default is RGB8.
      color_format: BGR8
    # Depth on the colour image's pixel grid, which the framework uses (/cameras/<camera>/depth_registered/image_raw).
    align_depth:
      enable: true

# FLIR Blackfly S (camera: blackfly), e.g. the monochrome BFS-U3-23S3M-C, through spinnaker_camera_driver;
# launch/camera_blackfly.launch.py starts it as /cameras/<camera>/blackfly. A monochrome model publishes mono8
# frames. The calibration is
# calibration/intrinsics/[<profile>/]camera_info_blackfly_<serial_number>.yaml below this file, set by the launch
# files.
# More options: ros2 param list /cameras/blackfly/blackfly. USB3 models need a larger USB buffer than Linux's default
# (usbcore.usbfs_memory_mb, e.g. 1000), otherwise frames are dropped at high frame rates.
# Write string values in quotes: YAML reads a bare Off as false, which the driver ignores.
/cameras/*/blackfly:
  ros__parameters:
    # Printed on the camera, shown in SpinView. The driver opens only this camera. Set per unit in a profile, under
    # /cameras/blackfly/blackfly: the launch files name the unit's intrinsics file after it.
    serial_number: ''  # '22260470', '22260466'
    # The frame interval at frame_rate must be longer than the exposure; the gain (dB) makes up for the short
    # exposure at the cost of noise.
    exposure_auto: 'Off'
    exposure_time: 300.0
    gain_auto: 'Off'
    gain: 18.0
    frame_rate_auto: 'Off'
    frame_rate_enable: true
    frame_rate: 158.0
    # Frames the driver holds between the camera and publishing: 1 publishes only the newest, for the lowest
    # latency.
    buffer_queue_size: 1
    # 2x2 binning: a quarter of the pixels, brighter, but pixel coordinates (corners, intrinsics) change with it.
    # Binning and image size are set explicitly, because the camera keeps them until it loses power, the driver
    # sets only listed parameters, and switching binning back off does not enlarge the image again. Both take
    # effect only at driver start, not at runtime. The size is the sensor's full size divided by the binning.
    binning_x: 1
    binning_y: 1
    offset_x: 0
    offset_y: 0
    image_width: 1920
    image_height: 1200

# Added by Claude Code:
# Capture camera (par_launch capture_camera): a second FLIR Blackfly S in software trigger mode, started as
# /capture_camera/blackfly next to the main camera and not remapped onto /camera/..., so its frames stay on
# /capture_camera/blackfly/image_raw. It sends no frames by itself: every
#   ros2 param set /capture_camera/blackfly trigger_software true
# makes it take one (config/blackfly_s_software_trigger.yaml maps that command). Subscribe RELIABLE: a best-effort
# subscriber can lose a whole full-resolution frame, and no other follows. After a USB reconnect the driver keeps
# running but the camera is back on its power-on settings (e.g. Bayer frames): restart the driver.
# The calibration is calibration/intrinsics/[<profile>/]camera_info_blackfly_<serial_number>.yaml, as for the
# main Blackfly.
/capture_camera/blackfly:
  ros__parameters:
    # Required: without it the driver would open whichever Blackfly it finds first, possibly the main camera.
    serial_number: ''
    trigger_selector: 'FrameStart'
    trigger_source: 'Software'
    trigger_mode: 'On'
    # In trigger mode the trigger decides when a frame is taken, not the frame rate
    frame_rate_enable: false
    # The driver restarts streaming when its last frame is older than this (s). Captures can be minutes apart, and a
    # restart between them can lose the next trigger, so effectively never (one day).
    acquisition_timeout: 86400.0
    buffer_queue_size: 1

# e-con See3CAM_CU40 RGB-IR camera (camera: cu40) through see3cam_cu40, started as /camera/cu40. It also publishes
# its infrared image, on the colour image's pixel grid (/camera/ir/image_raw). The colour image is not
# white-balanced and contains infrared light. The calibration is
# calibration/intrinsics/[<profile>/]camera_info_cu40[_<serial>].yaml below this file, set by the launch files,
# and only fits
# the image size it was made at.
/camera/cu40/see3cam_cu40_node:
  ros__parameters:
    # Part of the camera's /dev/v4l/by-id/ name, only needed if several are connected.
    serial: ''
    # Sensor mode: 672x380, 1280x720, 1920x1080 or 2688x1520.
    sensor_width_px: 1280
    sensor_height_px: 720
    # true: images at the sensor size with interpolated colours; false: half width and height, cheaper.
    full_resolution: true
    # Share of the blue, green and red signal that also reaches the infrared pixels, [b, g, r]; the node subtracts
    # it, so e.g. projected content fades from the infrared image. Depends on the sensor and on the light's
    # spectrum: measured with this setup's projector showing red, green and blue, each against black, as the
    # infrared increase divided by the colour increase (least squares). [0.0, 0.0, 0.0] leaves it uncorrected.
    # Uncorrected for now: the share varies across the image, so one set of shares for the whole image (this
    # setup's average: [0.0565, 0.0018, 0.0914]) leaves bright and dark patches where the projector shines, which
    # ir_gain makes clearly visible.
    visible_to_ir_leakage_bgr: [0.0, 0.0, 0.0]
    # Factor for the infrared image after that correction (1.0 to 64.0). Indoors without infrared lighting the
    # infrared signal is weak; the gain brightens it without costing frame rate, unlike a longer exposure, which
    # would also saturate the colour pixels. Noise is amplified with it.
    ir_gain: 16.0

# Event camera (camera: event) through metavision_driver, started as /cameras/<camera>/event by
# launch/camera_event.launch.py. It publishes the raw events on /cameras/<camera>/events (event_camera_msgs/EventPacket)
# only while something subscribes; /cameras/<camera>/event_renderer collects them into the camera images. No camera_info: the driver has no calibration. A SilkyEvCam needs its maker's OpenEB
# plugin, in the version of the driver's bundled OpenEB, and MV_HAL_PLUGIN_PATH set in the shell (README). Needs
# USB 3: on USB 2, changing a bias while events stream can abort the driver, and the camera then only opens again
# after replugging. More options: ros2 param list /cameras/event/event.
/cameras/*/event:
  ros__parameters:
    # The camera to open; empty opens the first one found. The driver logs the serial at start.
    serial: ''
    # Biases (contrast thresholds, filters), left out for the camera's defaults. Ranges depend on the sensor:
    # ros2 param describe /cameras/event/event <bias>, e.g. on a Gen3.1 sensor bias_diff_on 374-499, bias_diff_off
    # 100-234. They can also be changed while running, with ros2 param set.
    # bias_diff_on: 400
    # bias_diff_off: 200

# Turns the event camera's events into its camera images.
/cameras/*/event_renderer:
  ros__parameters:
    # Images per second; each collects the events since the one before.
    fps: 25.0
    # time_slice: all events between two images; sharp: adapts the number of events per image for sharper edges.
    display_type: 'time_slice'

surface_selector_node:
  ros__parameters:
    # Display the projector is connected to, as counted by pygame (0 = primary).
    display_id: 2

object_detector_node:
  ros__parameters:
    # Only with use_depth (depth cameras: kinect, realsense): objects lower than this above the table around them (metres) are not
    # published, e.g. pictures of objects projected onto the table. 0 = off; about 0.015 is above the Kinect's noise.
    min_object_height: 0.015

hand_landmarks_node:
  ros__parameters:
    # Maximum number of hands detected per frame (1 to 10), e.g. 2 for one person, more for several people at
    # the table. Every extra hand slows detection down.
    num_hands: 2
    # true: detect hands on the infrared frames instead of the colour frames; projected light on the hands does not
    # show in infrared. Only the chosen frames are used: a camera without infrared publishes no hands. With a depth
    # camera (use_depth, set by par.launch.py) the depth sensor's own infrared and depth
    # (the camera's depth_sensor/..., e.g. the Kinect's), with the landmarks moved into the colour image; otherwise the
    # infrared on the colour grid (the camera's ir/image_raw, e.g. the CU40's).
    use_ir: false

# Markers in the camera's image_raw (or its compressed variant), published on /fiducials.
# use_compressed and use_depth follow from the streams the camera offers: par.launch.py sets them.
fiducials_detector_node:
  ros__parameters:
    # aruco or apriltag
    marker_type: aruco
    # Without the DICT_ / DICT_APRILTAG_ prefix. The printed pages (page_locator) and the projected
    # calibration markers (projection_calibrator_node) use 4X4_100.
    dictionary: 4X4_100
    # none, subpix, contour or apriltag: more precise corners at the cost of detection time
    corner_refinement: none
    # Subtracted in the adaptive thresholding (OpenCV default 7); tune it if markers are missed under the
    # projector light
    adaptive_thresh_constant: 7.0
    # Adaptive threshold windows in pixels (OpenCV defaults 3 and 23, steps of 10): the frame is thresholded and
    # searched once per window. Setting both to one size that suits the markers' size in the image (e.g. 23 for
    # markers about 30 px across) detects faster; check that no markers are lost.
    adaptive_thresh_win_size_min_px: 3
    adaptive_thresh_win_size_max_px: 23
    # How each candidate's bits are read (OpenCV defaults 4 and 0.13): its square is resampled to this many pixels
    # per cell, ignoring this fraction of each cell at its edges. For markers only a few camera pixels per cell
    # wide, more pixels and a wider margin (e.g. 8 and 0.3) average out sensor noise and blurred cell edges.
    bit_sample_px_per_cell: 4
    bit_ignored_margin_per_cell: 0.13
    # 0: off. 2 or more: also detect on the mean of the last this many frames and add the markers only the mean
    # finds. For noisy frames (short exposure at high gain) while markers lie still; doubles the detection time.
    temporal_mean_frame_count: 0
    # 0: off. More than 0: search each frame only in square windows of this size (pixels) around the known markers,
    # and whole frames in a background thread full_scan_rate_hz times a second to find new or lost markers. Much
    # faster per frame on large images; the window must hold a marker plus its movement between two frames.
    tracking_window_size_px: 0
    full_scan_rate_hz: 5.0
    # true: show the frames with the detected markers in a window (needs a display) and print the detection
    # accuracy. Slows detection down a little, so only for testing.
    debug: false

# Pages of paper with an ArUco marker in each corner (page n: markers 4n .. 4n+3), from /fiducials.
# Print them with: python src/page_locator/utils/make_page_template.py <page ids> --marker-size-mm <marker_size_mm>
page_locator_node:
  ros__parameters:
    page_width_mm: 210.0
    page_height_mm: 297.0
    # Printed layout, as make_page_template prints it: marker id % 4 in the page corner of the same index, clockwise
    # from the top left, upright. Measure it on the paper:
    # page corners far from the visible markers are only right if these are.
    # Side of a marker including its black border.
    marker_size_mm: 20.0
    # Gap between a marker and both page edges next to it.
    marker_margin_mm: 5.0
    # Page corner of the markers with id % 4 = 0, 1, 2, 3, and their clockwise quarter turns (0 = upright).
    # Older sheets:
    #   printed VIGITIA document pages: [bottom_left, top_left, top_right, bottom_right], 3 turns
    #   VIGITIA book pages (data/book_pages in the old framework): [bottom_right, bottom_left, top_left, top_right],
    #   0 turns
    marker_corners: [top_left, top_right, bottom_right, bottom_left]
    marker_quarter_turns: 0
    # Marker ids from 4 * max_pages on are ignored. 25 allows all ids of DICT_4X4_100; the documents use page
    # 24 (ids 96-99). Keep the projected calibration markers (projection_calibrator_node) out of the page ids
    # in use.
    max_pages: 25
    # A page not seen for this long counts as removed.
    hold_time_sec: 0.5
    # 1€ filter on the page corners. Cutoff frequency while the page lies still; lower removes more jitter.
    smoothing_min_cutoff_hz: 0.5
    # Added cutoff frequency (Hz) per px/s of corner speed; higher lags less behind a moving page, but lets
    # more noise through while only one marker is visible.
    smoothing_beta_per_px: 0.05
    # true: show the frames with the page markers and pages in a window (needs a display). Green: page fitted to
    # two or more markers, yellow: moved by its only visible marker, magenta: not seen, held. Costs a frame decode
    # per fiducials message, so only for testing. par.launch.py sets use_compressed for the camera.
    debug: false

# Automatic table-to-projector calibration (projection_calibration.launch.py).
projection_calibrator_node:
  ros__parameters:
    # Its display_id (the projector, whose resolution is read from it) comes from
    # par_launch.projector_display_id.
    # ArUco dictionary without the DICT_ prefix. Must match fiducials_detector, which
    # uses 4X4_100 unless its dictionary parameter says otherwise.
    dictionary: 4X4_100
    # Ids of the projected markers (3x3 grid). Define their IDs here if other markers are present to avoid mismatches
    marker_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    # A fit with a larger RMS error in projector pixels is rejected.
    max_reprojection_error_px: 5.0
    # projector_center:=true only: a projector center whose rays miss it by more than this RMS distance in
    # metres is rejected.
    max_center_ray_distance_m: 0.01

# Mask of the projector pixels that would land on hands and objects (ros2-par-framework-projection-mask,
# /projector/mask). Needs a depth camera and the projection calibration, ideally with the projector centre.
projection_mask_node:
  ros__parameters:
    # Points higher than this above the table (metres) are masked; below it, the depth noise of the bare table.
    min_height: 0.015
    # Points higher than this are ignored, e.g. depth errors.
    max_height: 1.0
    # The mask grows by this many projector pixels, to cover depth holes at edges and the delay until the image
    # is projected. Raise it if fast hands get lit at their edges.
    margin_px: 15
    # Only every stride-th depth pixel in each direction is used: larger is faster and coarser. The Kinect's
    # registered depth is interpolated up from a coarser sensor: with WFOV_2X2BINNED one depth pixel covers about
    # 5 colour pixels, so 6 still samples about every one of them.
    stride: 6
    # true: also show the mask fullscreen on the projector, white where the light may go, black where it would
    # hit something (Esc or q closes it). It takes the projector and slows the mask a little, so only for
    # testing. There is no launch argument for it: switch it here.
    debug: false
    # Display the projector is connected to, as counted by pygame (0 = primary).
    display_id: 2

# Demo application (ros2-par-framework-demo-application): lights every page on the table with the projector.
demo_app_node:
  ros__parameters:
    # Its display_id comes from par_launch.projector_display_id.
    # What is projected onto each page: white fills it, checkerboard shows a moving checkerboard that sticks to the
    # paper, to show that page tracking keeps working under projected content.
    page_content: white

# The ROS bridge of the rendering manager (par_launch.projector_app: rendering_manager): one app per detected page,
# placed on the paper. Which page holds which app: every page gets the
# page_app_* app (default: page_app_url in a Chromium kiosk window, landscape); a page listed in
# page_ids_with_own_app gets its own under page_apps.page<id>, where each option left out keeps the page_app_ value.
# Read at start: restart the launch after a change. Example, set in a profile:
#   page_ids_with_own_app: [1, 2]
#   page_apps:
#     page1:
#       url: 'https://www.uni-regensburg.de/'
#       quarter_turns_counterclockwise: 0   # portrait
#     page2:
#       command: 'gnome-text-editor --standalone'
rendering_manager_bridge_node:
  ros__parameters:
    page_app_url: 'https://www.openstreetmap.org'
    # 0 upright, 1 landscape read from the page's right side, 3 from its left side
    page_app_quarter_turns_counterclockwise: 1
    # Gaps to the page edges; top and bottom keep the app off the corner markers
    page_app_left_right_inset_mm: 2.0
    page_app_top_bottom_inset_mm: 30.0
    # App pixels per millimetre of paper: more shows smaller content
    page_app_px_per_mm: 4.0

# Pose of the Brio body frame (brio_link, x forward, z up) in world, in metres.
# PLACEHOLDER -- DO NOT EDIT. 0.93 m above world, looking straight down (pitch +90 deg); it only
# keeps the launch files working until the real pose is set. That is
# calibration/extrinsics/camera_pose_<camera>.yaml below this file: the launch files use it instead of this
# entry while it exists, so edits here are silently ignored then. camera_pose_calibrator measures it for the
# Kinect; for the Brio and the webcam, write it by hand with the same seven keys, flat. For a camera h m above
# the table, tilted t deg from straight down towards world +x (a = (90 - t) / 2):
#   translation.x: 0.0
#   translation.y: 0.0
#   translation.z: h
#   rotation.x: 0.0
#   rotation.y: sin(a)
#   rotation.z: 0.0
#   rotation.w: cos(a)
# camera_pose_calibrator takes what it does not set (the x/y position, the Kinect's rotation about the
# vertical) from here, so keep these values the same for every setup.
# The launch files (launch_helpers.mount_tf_publisher) pass the pose to static_transform_publisher
# as command-line flags, because it ignores it as parameters.
/brio_tf_publisher:
  ros__parameters:
    translation.x: 0.0
    translation.y: 0.0
    translation.z: 1.0
    rotation.x: 0.0
    rotation.y: 0.7071068
    rotation.z: 0.0
    rotation.w: 0.7071068

# Pose of the webcam body frame (webcam_link). PLACEHOLDER -- DO NOT EDIT, see /brio_tf_publisher.
# The real pose is calibration/extrinsics/camera_pose_webcam.yaml below this file, written by hand.
/webcam_tf_publisher:
  ros__parameters:
    translation.x: 0.0
    translation.y: 0.0
    translation.z: 1.0
    rotation.x: 0.0
    rotation.y: 0.7071068
    rotation.z: 0.0
    rotation.w: 0.7071068

# Pose of the RealSense body frame (realsense_link, x forward, z up). PLACEHOLDER -- DO NOT EDIT, see
# /brio_tf_publisher. The real pose is calibration/extrinsics/camera_pose_realsense.yaml below this file.
/realsense_tf_publisher:
  ros__parameters:
    translation.x: 0.0
    translation.y: 0.0
    translation.z: 1.0
    rotation.x: 0.0
    rotation.y: 0.7071068
    rotation.z: 0.0
    rotation.w: 0.7071068

# Pose of the Blackfly body frame (blackfly_link). PLACEHOLDER -- DO NOT EDIT, see /brio_tf_publisher.
# The real pose is calibration/extrinsics/camera_pose_blackfly.yaml below this file, written by hand.
/blackfly_tf_publisher:
  ros__parameters:
    translation.x: 0.0
    translation.y: 0.0
    translation.z: 0.93
    rotation.x: 0.0
    rotation.y: 0.7071068
    rotation.z: 0.0
    rotation.w: 0.7071068

# Pose of the See3CAM_CU40 body frame (cu40_link). PLACEHOLDER -- DO NOT EDIT, see /brio_tf_publisher.
# The real pose is calibration/extrinsics/camera_pose_cu40.yaml below this file, written by hand.
/cu40_tf_publisher:
  ros__parameters:
    translation.x: 0.0
    translation.y: 0.0
    translation.z: 1.0
    rotation.x: 0.0
    rotation.y: 0.7071068
    rotation.z: 0.0
    rotation.w: 0.7071068

# Pose of the event camera body frame (event_link). PLACEHOLDER -- DO NOT EDIT, see /brio_tf_publisher.
# The real pose is calibration/extrinsics/camera_pose_event.yaml below this file, written by hand.
/event_tf_publisher:
  ros__parameters:
    translation.x: 0.0
    translation.y: 0.0
    translation.z: 1.0
    rotation.x: 0.0
    rotation.y: 0.7071068
    rotation.z: 0.0
    rotation.w: 0.7071068

# Azure Kinect driver, started in /cameras/<camera> by launch/camera_kinect.launch.py. The node sets this name in
# code. Its frames are prefixed with the camera's name (tf_prefix, set by the launch file): kinect_camera_base, ...
/cameras/*/k4a_ros_device_node:
  ros__parameters:
    # Serial number of the Kinect to open. Empty: the first one found.
    sensor_sn: ""
    # Colour camera. bgra is needed for the coloured point cloud; 1080P is 1920x1080
    # like the Brio.
    color_enabled: true
    color_format: bgra
    color_resolution: 1080P
    # NFOV_UNBINNED: 640x576, 75x65 deg, 0.5-3.9 m, the finest depth at 30 fps, but check that
    # its view covers the whole projection area (its corners are cut off). WFOV_2X2BINNED:
    # 512x512, 120x120 deg, coarser but less noisy, 30 fps. WFOV_UNBINNED: 1024x1024, 120x120
    # deg, at most 15 fps.
    depth_enabled: true
    depth_mode: WFOV_2X2BINNED
    # 5, 15 or 30, for both cameras. 30 halves the delay of the projection mask.
    fps: 30
    # Coloured point cloud on /points2. In the depth frame it has the depth resolution
    # (~370k points) instead of the colour resolution (~2M points), which RViz handles
    # far better. Off for now: with all detectors running it saturates the CPU; turn
    # both on again (and the RViz display) when needed.
    point_cloud: false
    rgb_point_cloud: false
    point_cloud_in_depth_frame: true

# Pose of the Kinect body frame (kinect_camera_base, x forward, z up) in world, in metres.
# PLACEHOLDER -- DO NOT EDIT, see /brio_tf_publisher. Front glass to table 1.0 m, looking straight down.
# The real pose is calibration/extrinsics/camera_pose_kinect.yaml below this file, measured by
# camera_pose_calibrator (camera_pose_calibration_kinect.launch.py): height and tilt from the
# depth image of the clear table.
/kinect_tf_publisher:
  ros__parameters:
    translation.x: 0.0
    translation.y: 0.0
    translation.z: 1.00
    rotation.x: 0.0
    rotation.y: 0.7071068
    rotation.z: 0.0
    rotation.w: 0.7071068

# Which camera and nodes par.launch.py starts; launch arguments override it for one run. No node has
# this name, so the nodes ignore it. One switch per node instead of a list: every node parses this whole file,
# and an empty list has no type a node could read.
par_launch:
  ros__parameters:
    # brio, kinect, realsense, webcam, blackfly, cu40 or event
    camera: kinect
    object_detector: false
    fiducials_detector: false
    hand_landmarks: false
    # Needs fiducials_detector
    page_locator: false
    # Needs hand_landmarks
    gesture_detector: false
    # RViz with rviz_bridge
    rviz: false
    # Keeps projected light off hands and objects (/projector/mask); needs a depth camera, the calibration and
    # ros2-par-framework-projection-mask in config/nodes.list
    projection_mask: false
    # The one app that owns the projector: none, rendering_manager (Wayland compositor with its bridge, one app per
    # detected page; needs ros2-par-framework-rendering-manager in config/nodes.list and page_locator) or the
    # package of an installed PAR app, e.g. demo_app (ros2-par-framework-demo-application). A PAR app registers in
    # the ament index (templates/par_app/), and the framework nodes it requires are switched on for it.
    projector_app: none
    # The apps this setup offers (package names as for projector_app), set in the setup wizard's Apps area; its Run
    # menu chooses projector_app among them. par.launch.py starts only projector_app
    apps: []
    # Display the projector is connected to, counted like SDL/pygame (0 = primary); the projector app gets it as
    # its display_id. The number changes when displays are plugged in or out, so a profile made by the setup wizard
    # also stores the projector's identity (projector_manufacturer_id, projector_model_name, projector_serial_text,
    # projector_connector_name, from its EDID), and launches find the projector by it instead. It also stores the
    # display mode the projector was chosen with (projector_width_px, projector_height_px, projector_refresh_rate_hz),
    # so the wizard warns when it changed and the projector calibration may no longer fit
    projector_display_id: 2
    # Second FLIR Blackfly S next to the main camera, which takes single high-resolution frames on request
    # (/capture_camera/blackfly, see there); needs its serial_number
    capture_camera: false
