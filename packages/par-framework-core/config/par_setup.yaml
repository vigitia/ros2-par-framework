# Co-authored by Claude Code.
# The framework's own parameters, the base every launch loads: which cameras and nodes par.launch.py
# starts (par_launch) and the cameras' placeholder pose. A profile (config/profiles/<name>.yaml, written
# by the setup wizard) overrides what differs for one physical setup.
#
# Nodes are not configured here: each node declares its defaults in its own code, and a camera type
# for a third-party driver brings its defaults as its entry's parameters_file
# (packages/par_camera_adapters/config/). A profile overrides both under the node's full name, e.g.
# /cameras/<camera>/page_locator_node or /cameras/*/page_locator_node for every camera.

# Placeholder pose of every camera's body frame (<camera>_<body_frame>, e.g. overhead_link, x forward, z up) in
# world, in metres. PLACEHOLDER -- DO NOT EDIT. 1 m above world, looking straight down (pitch +90 deg); it only
# keeps the launch files working until the real pose is set. That is
# calibration/extrinsics/camera_pose_<camera>.yaml below this file: the launch files use it instead of this
# entry while it exists, so edits here are silently ignored then. camera_pose_calibration_depth.launch.py (depth
# cameras) and camera_pose_calibration_sheet.launch.py measure it; or write it by hand with the same seven keys,
# flat. For a camera h m above the table, tilted t deg from straight down towards world +x (a = (90 - t) / 2):
#   translation.x: 0.0
#   translation.y: 0.0
#   translation.z: h
#   rotation.x: 0.0
#   rotation.y: sin(a)
#   rotation.z: 0.0
#   rotation.w: cos(a)
# camera_pose_calibrator takes what it does not set (the x/y position, the rotation about the vertical) from
# here, so keep these values the same for every setup. A profile places one camera of several elsewhere with a
# section of the same seven keys named after its mount transform publisher, /<camera>_tf_publisher.
# The launch files (launch_helpers.create_mount_tf_publisher) pass the pose to static_transform_publisher
# as command-line flags, because it ignores it as parameters. No node has this name, so no node reads it.
placeholder_camera_pose:
  ros__parameters:
    translation.x: 0.0
    translation.y: 0.0
    translation.z: 1.0
    rotation.x: 0.0
    rotation.y: 0.7071068
    rotation.z: 0.0
    rotation.w: 0.7071068


# Which cameras and nodes par.launch.py starts; launch arguments override it for one run. No node has
# this name, so the nodes ignore it (an empty list in it does not disturb them).
# Sensor nodes: in a profile, one key per installed sensor node (ament index par_framework_sensor_nodes),
# listing the cameras (names from cameras) it runs on, e.g. fiducials_detector: [overhead]. A node without
# a key runs on no camera. It runs once per listed camera, in /cameras/<camera>, with its own defaults and
# a profile's sections /cameras/*/<node> (every camera) and /cameras/<camera>/<node> (that camera only).
par_launch:
  ros__parameters:
    # Every camera of the setup: its name (lower case, digits and _) and its unit, '<type>' or '<type>:<serial>',
    # with a camera type installed in the ament index (ament_index par_framework_cameras), e.g.
    #   cameras: {overhead: 'blackfly:22260470', capture: 'blackfly:25290614'}
    # The name makes its namespace (/cameras/<name>), frames (<name>_link, ...), placeholder pose
    # (/<name>_tf_publisher) and extrinsics files; the unit makes its intrinsics file. The first camera is the main
    # camera RViz uses. A profile's cameras replace these instead of being merged with them.
    # No default: which camera a setup has is the profile's choice (the setup wizard writes it). Without a
    # profile, camera:=<type> starts one camera, e.g. camera:=webcam.
    # RViz with rviz_bridge
    rviz: false
    # The one app that owns the projector: none or the package of an installed PAR app, e.g. demo_app
    # (ros2-par-framework-demo-application) or rendering_manager (one app per detected page). A PAR app registers in
    # the ament index (templates/par_app/), and the framework nodes it requires are switched on for it.
    projector_app: none
    # The apps this setup offers (package names as for projector_app), set in the setup wizard's Apps area; its Run
    # menu chooses projector_app among them. par.launch.py starts only projector_app
    apps: []
    # The camera each input of an app reads (the inputs its ament index entry names), e.g.
    #   app_inputs: {demo_app: {camera: overhead}}
    # set in the setup wizard's Apps area. An input left out reads the only camera of a run.
    # Display the projector is connected to, counted like SDL/pygame (0 = primary); the projector app gets it as
    # its display_id. The number changes when displays are plugged in or out, so a profile made by the setup wizard
    # also stores the projector's identity (projector_manufacturer_id, projector_model_name, projector_serial_text,
    # projector_connector_name, from its EDID), and launches find the projector by it instead. It also stores the
    # display mode the projector was chosen with (projector_width_px, projector_height_px, projector_refresh_rate_hz),
    # so the wizard warns when it changed and the projector calibration may no longer fit
    # 0 by default, so a computer without a projector can still start the launches that draw on it.
    projector_display_id: 0
