<?xml version="1.0" encoding="UTF-8"?>
<!-- Written by Claude Code: app icon of the PAR setup wizard, a projector shining light onto a table -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#1F3A2B"/>
  <!-- Ceiling mount -->
  <rect x="122" y="22" width="12" height="18" rx="3" fill="#90A4AE"/>
  <!-- Light cone from the lens to the table top -->
  <polygon points="118,84 138,84 206,176 50,176" fill="#FFF59D" fill-opacity="0.45"/>
  <!-- Projector body and lens -->
  <rect x="78" y="38" width="100" height="44" rx="10" fill="#CFD8DC"/>
  <rect x="88" y="48" width="36" height="6" rx="3" fill="#90A4AE"/>
  <circle cx="128" cy="82" r="12" fill="#455A64"/>
  <circle cx="128" cy="82" r="7" fill="#FFF59D"/>
  <!-- Table: top with the projected image, legs -->
  <rect x="34" y="176" width="188" height="14" rx="4" fill="#8D6E63"/>
  <rect x="50" y="171" width="156" height="7" rx="3" fill="#FFF176"/>
  <rect x="50" y="190" width="12" height="42" rx="3" fill="#6D4C41"/>
  <rect x="194" y="190" width="12" height="42" rx="3" fill="#6D4C41"/>
</svg>
